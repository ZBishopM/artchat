[package]
name = "art-chat-egui"
version = "0.6.0"
edition = "2021"
description = "ArtChat: dibujo y chat en vivo, cliente nativo (egui) del relé art-chat-server"
build = "build.rs"

[[bin]]
name = "artchat"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
# native-tls = Schannel en Windows: nada que instalar en la máquina de quien lo ejecute.
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Guardar y recuperar el lienzo (PNG) y leer el icono de la ventana.
png = "0.17"

# En Linux eframe necesita decir qué servidor gráfico usa; en Windows y macOS no hace falta.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
